name: News check

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub's minimum interval; runs often start a few minutes late
  workflow_dispatch: {} # manual run button for testing

permissions:
  contents: write # needed to push dedup state to the `state` branch

# Two overlapping runs would load the same state and double-alert.
concurrency:
  group: news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        run: bash scripts/restore_state.sh

      - name: Check news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m newsbot.main

      # Runs even when the check step fails: the bot saves state before exiting non-zero, and the
      # throttle for the "API is broken" alert lives in that state.
      - name: Save state
        if: always()
        run: bash scripts/save_state.sh
